<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SolarYield Estimator{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #F7F9F7;
            --color-surface: #FFFFFF;
            --color-ink: #1F2A24;
            --color-muted: #5B6B62;
            --color-gold: #E8940C;
            --color-gold-deep: #C97A05;
            --color-green: #0E6B4F;
            --color-green-tint: #E7F3EE;
            --color-border: #E3E8E5;
        }
        body {
            background: var(--color-bg);
            color: var(--color-ink);
            font-family: 'Inter', system-ui, sans-serif;
        }
        h1, h2, h3, .display-font {
            font-family: 'Fraunces', Georgia, serif;
        }
        header.hero {
            background: linear-gradient(120deg, var(--color-green) 0%, #14805F 55%, var(--color-gold) 130%);
            color: #fff;
            padding: 2.25rem 0;
            margin-bottom: 2rem;
        }
        header.hero h1 { font-size: 2rem; font-weight: 600; margin-bottom: 0.25rem; }
        header.hero p { color: rgba(255,255,255,0.88); margin-bottom: 0; max-width: 40em; }
        .card {
            border: 1px solid var(--color-border);
            border-radius: 0.6rem;
            box-shadow: none;
        }
        .card-input { background: var(--color-surface); }
        .card-result {
            background: var(--color-green-tint);
            border-color: #CFE6DC;
        }
        .btn-primary {
            background: var(--color-green);
            border-color: var(--color-green);
        }
        .btn-primary:hover, .btn-primary:focus {
            background: #0B5A41;
            border-color: #0B5A41;
        }
        .figure-large {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2.1rem;
            font-weight: 600;
            color: var(--color-green);
        }
        a { color: var(--color-green-deep, var(--color-green)); }
    </style>
</head>
<body>
    <header class="hero">
        <div class="container">
            <h1>SolarYield Estimator</h1>
            <p>Estimate daily solar energy yield and monthly savings for a Philippine home or business, built on a model trained from real solar-plant generation data.</p>
        </div>
    </header>
    <main class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
